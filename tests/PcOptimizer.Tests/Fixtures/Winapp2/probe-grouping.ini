; @file    : probe-grouping.ini
; @author  : rudals252
; @brief   : 앱 카드 묶음 기준 테스트용 커뮤니티 규칙(winapp2 형식). Chrome 3개·Edge 1개 섹션은 스냅샷 v260915 항목을 그대로 옮겼고(Section= 값 공유), Section=Games 3개·Section=Adobe 2개도 스냅샷 항목을 그대로 옮겼다(범주·제품군 값이라 앱 묶음 기준이 아님). Vendor 2개는 숫자 LangSecRef·숫자 Section= 값만 같은 구성 항목이다. 실제 PC 경로 아님

[Google Chrome Bookmark Backups *]
Section=Google Chrome Web Browser
DetectFile=%LocalAppData%\Google\Chrome*
FileKey1=%LocalAppData%\Google\Chrome*\User Data\*|Bookmarks.bak

[Google Chrome Bookmark Favicons *]
Section=Google Chrome Web Browser
DetectFile=%LocalAppData%\Google\Chrome*
FileKey1=%LocalAppData%\Google\Chrome*\User Data\*|favicons*

[Google Chrome Storage Quota Manager *]
Section=Google Chrome Web Browser
DetectFile=%LocalAppData%\Google\Chrome*
FileKey1=%LocalAppData%\Google\Chrome*\User Data\*|QuotaManager

[Microsoft Edge Storage Quota Manager *]
Section=Microsoft Edge Web Browser
DetectFile=%LocalAppData%\Microsoft\Edge*
FileKey1=%LocalAppData%\Microsoft\Edge*\User Data\*|QuotaManager

[Vendor Alpha Logs *]
LangSecRef=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%LocalAppData%\Vendor|*.log

[Vendor Beta Temp *]
Section=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%LocalAppData%\Temp|*.tmp

[3 Stars of Destiny *]
Section=Games
DetectFile=%AppData%\3Stars
FileKey1=%AppData%\3Stars|*.tmp

[3SwitcheD *]
Section=Games
DetectFile=%LocalAppData%\3SwitcheD
FileKey1=%LocalAppData%\3SwitcheD\cache|*|RECURSE

[AMID EVIL *]
Section=Games
DetectFile=%LocalAppData%\AmidEvil
FileKey1=%LocalAppData%\AmidEvil\Saved\Logs|*

[Adobe Camera Raw *]
Section=Adobe
DetectFile=%AppData%\Adobe\CameraRaw
FileKey1=%AppData%\Adobe\CameraRaw\Logs|*
FileKey2=%LocalAppData%\Adobe\CameraRaw\Cache*|*

[Adobe InDesign *]
Section=Adobe
DetectFile=%AppData%\Adobe\InDesign
FileKey1=%AppData%\Adobe\InDesign*\Logs|*
