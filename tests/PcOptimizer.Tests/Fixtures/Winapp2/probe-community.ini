; @file    : probe-community.ini
; @author  : rudals252
; @brief   : 앱 캐시 프로브 파이프라인 테스트용 커뮤니티 규칙(winapp2 형식으로 구성, [Python *]·[NVIDIA Shader Cache *]는 스냅샷 v260915 항목을 줄여 옮김). 실제 PC 경로 아님

[Python *]
LangSecRef=3024
Detect=HKCU\Software\Python
FileKey1=%LocalAppData%\Pip\cache|*|RECURSE

[NVIDIA Shader Cache *]
LangSecRef=3024
Detect=HKLM\Software\NVIDIA Corporation
FileKey1=%LocalAppData%\NVIDIA\*Cache|*|RECURSE

[Vendor Logs *]
LangSecRef=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%LocalAppData%\Vendor|*.log|RECURSE
ExcludeKey1=FILE|%LocalAppData%\Vendor\|keep.log

[Vendor In Program Files *]
LangSecRef=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%ProgramFiles%\Vendor\Cache|*|RECURSE

[Not Installed *]
LangSecRef=3021
Detect=HKCU\Software\NotInstalled
FileKey1=%LocalAppData%\NotInstalled|*|RECURSE

[Registry Only Unsupported *]
LangSecRef=3021
Detect=HKCU\Software\Python
RegKey1=HKCU\Software\Python\MRU

[Other Users Wildcard *]
LangSecRef=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%SystemDrive%\Users\*\.vendor_usage|*|RECURSE

[Windows Recycle Bin *]
LangSecRef=3025
Detect=HKCU\Software\Python
FileKey1=%SystemDrive%\$Recycle.Bin|*|RECURSE

[Mixed Merged And Protected *]
LangSecRef=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%LocalAppData%\npm-cache|*|RECURSE
FileKey2=%ProgramFiles%\Mixed|*|RECURSE

[Public Vendor *]
LangSecRef=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%Public%\Vendor|*.tmp

[Junction Path *]
LangSecRef=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%SystemDrive%\Documents and Settings\Default\Junctioned|*|RECURSE

[Unresolved Music *]
LangSecRef=3021
DetectFile=%LocalAppData%\Vendor
FileKey1=%Music%\Vendor|*.tmp
