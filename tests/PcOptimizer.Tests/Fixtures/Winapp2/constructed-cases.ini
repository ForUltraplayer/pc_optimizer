; @file    : constructed-cases.ini
; @author  : rudals252
; @brief   : 파서 테스트용으로 직접 만든 winapp2 형식 항목(스냅샷 v260915에는 DetectOS·SpecialDetect·볼륨 루트 FileKey 등이 없어 형식만 따라 구성). 실제 앱 규칙이 아님
orphan-line-outside-section=1

[OS Limited Fake App *]
LangSecRef=3021
DetectOS=10.0|
Detect=HKCU\Software\FakeVendor\OsLimited
FileKey1=%LocalAppData%\FakeVendor\OsLimited\Cache|*|RECURSE

[Unknown Key Fake App *]
LangSecRef=3021
Detect=HKCU\Software\FakeVendor\UnknownKey
FileKey1=%LocalAppData%\FakeVendor\UnknownKey\Logs|*.log
FutureKey1=whatever

[Special Detect Fake App *]
LangSecRef=3021
SpecialDetect=DET_CHROME
FileKey1=%LocalAppData%\FakeVendor\Special|*.tmp

[Volume Root Fake App *]
LangSecRef=3021
DetectFile=%LocalAppData%\FakeVendor\VolumeRoot
FileKey1=%SystemDrive%|*.log

[Volume Root Slash Fake App *]
LangSecRef=3021
DetectFile=%LocalAppData%\FakeVendor\VolumeRoot
FileKey1=%SystemDrive%\|*.tmp

[Unc Fake App *]
LangSecRef=3021
DetectFile=%LocalAppData%\FakeVendor\Unc
FileKey1=\\fakeserver\share\cache|*|RECURSE

[No Detection Fake App *]
LangSecRef=3021
FileKey1=%LocalAppData%\FakeVendor\NoDetect\Cache|*|RECURSE

[Too Deep Fake App *]
LangSecRef=3021
DetectFile=%LocalAppData%\FakeVendor\Deep
FileKey1=%LocalAppData%\FakeVendor\*\*\*\*\*|*.log

[Exclude File And Path Fake App *]
LangSecRef=3021
Default=False
Warning=Constructed warning text for tests.
Detect1=HKLM\Software\FakeVendor\Excludes
Detect2=HKCR\FakeVendor.Document
DetectFile=%LocalAppData%\FakeVendor\Excl*
FileKey1=%LocalAppData%\FakeVendor\Excludes|*.log;*.tmp|RECURSE
FileKey2=%LocalAppData%\FakeVendor\Excludes\Cache|*|REMOVESELF
ExcludeKey1=FILE|%LocalAppData%\FakeVendor\Excludes\|keep.log
ExcludeKey2=PATH|%LocalAppData%\FakeVendor\Excludes\Saved\|*
RegKey1=HKCU\Software\FakeVendor\Excludes\MRU

[Unknown Exclude Flag Fake App *]
LangSecRef=3021
Detect=HKCU\Software\FakeVendor\UnknownExclude
FileKey1=%LocalAppData%\FakeVendor\UnknownExclude|*|RECURSE
ExcludeKey1=FOLDER|%LocalAppData%\FakeVendor\UnknownExclude\Keep\|*

[Unknown Flag Fake App *]
LangSecRef=3021
Detect=HKCU\Software\FakeVendor\UnknownFlag
FileKey1=%LocalAppData%\FakeVendor\UnknownFlag|*|RECURSEALL

[Pattern Separator Fake App *]
LangSecRef=3021
Detect=HKCU\Software\FakeVendor\PatternSeparator
FileKey1=%LocalAppData%\FakeVendor\PatternSeparator|sub\*.log
