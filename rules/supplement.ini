; @file    : supplement.ini
; @author  : rudals252
; @brief   : PC Optimizer가 검토한 앱 캐시 보충 규칙 7종(winapp2 형식, 조회 범위 계산 전용). 영향 설명·지원 버전·참조는 rule-metadata.json에 있다
;
; License: CC-BY-SA-4.0 (project policy, design spec section 2). This file follows the Winapp2.ini format
; defined by the winapp2 project (https://github.com/MoscaDotTo/Winapp2, CC-BY-SA-4.0).
; PC Optimizer does not delete, move or modify anything; FileKey/REMOVESELF are used only to compute what to observe.

[Adobe Media Cache Files *]
Section=PC Optimizer Supplement
DetectFile=%AppData%\Adobe\Common
FileKey1=%AppData%\Adobe\Common\Media Cache Files|*|RECURSE
FileKey2=%AppData%\Adobe\Common\Media Cache|*|RECURSE
FileKey3=%AppData%\Adobe\Common\Peak Files|*|RECURSE

[npm cache *]
Section=PC Optimizer Supplement
DetectFile=%LocalAppData%\npm-cache
FileKey1=%LocalAppData%\npm-cache|*|RECURSE

[pip cache *]
Section=PC Optimizer Supplement
DetectFile=%LocalAppData%\pip\Cache
FileKey1=%LocalAppData%\pip\Cache|*|RECURSE

[NuGet global packages *]
Section=PC Optimizer Supplement
DetectFile=%UserProfile%\.nuget\packages
FileKey1=%UserProfile%\.nuget\packages|*|RECURSE

[Steam shader cache *]
Section=PC Optimizer Supplement
Detect=HKCU\Software\Valve\Steam
FileKey1=%ProgramFiles%\Steam\steamapps\shadercache|*|RECURSE

[NVIDIA and Direct3D shader caches *]
Section=PC Optimizer Supplement
DetectFile1=%LocalAppData%\NVIDIA\DXCache
DetectFile2=%LocalAppData%\NVIDIA\GLCache
DetectFile3=%LocalAppData%\D3DSCache
FileKey1=%LocalAppData%\NVIDIA\DXCache|*|RECURSE
FileKey2=%LocalAppData%\NVIDIA\GLCache|*|RECURSE
FileKey3=%LocalAppData%\D3DSCache|*|RECURSE

[Squirrel app version folders *]
Section=PC Optimizer Supplement
DetectFile1=%LocalAppData%\Discord\Update.exe
DetectFile2=%LocalAppData%\slack\Update.exe
DetectFile3=%LocalAppData%\GitHubDesktop\Update.exe
FileKey1=%LocalAppData%\Discord\app-*|*|RECURSE
FileKey2=%LocalAppData%\slack\app-*|*|RECURSE
FileKey3=%LocalAppData%\GitHubDesktop\app-*|*|RECURSE
